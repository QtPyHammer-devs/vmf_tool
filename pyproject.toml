[project]
name = "vmf_tool"
version = "0.2.0"
description = "A library for interpreting & editing .vmf files"
readme = "README.md"
requires-python = ">=3.6"  # TODO: confirm
license = { file = "LICENSE" }
authors = [
    {name="snake-biscuits", email="bikkie.dev@gmx.com"}
]
maintainers = [
    {name="snake-biscuits", email="bikkie.dev@gmx.com"}
]
keywords = [
    "source",
    "valve",
    "vmf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: First Person Shooters",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "valvevmf"
]

[project.optional-dependencies]
tests = [
    "flake8",
    "pytest",
    "pytest_cov",
]

[project.urls]
"Repository" = "https://github.com/QtPyHammer-devs/vmf_tool"
# "Changelog" = "https://github.com/QtPyHammer-devs/vmf_tool/blob/main/CHANGELOG.md"
"Bug Reports" = "https://github.com/QtPyHammer-devs/vmf_tool/issues"
# "Funding" = ...

[build-system]
requires = ["hatchling >= 1.13"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/vmf_tool/**",
    "/tests/**",
]

[tool.hatch.build.targets.wheel]
only-packages = true

[tool.hatch.metadata]
allow-direct-references = true
